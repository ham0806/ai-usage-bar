name: ci

on:
  push:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"
  pull_request:
    branches: [master]
    paths-ignore:
      - "*.md"
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test AiUsageBar.sln -c Release --nologo
