[project]
name = "ai-usage-bar"
version = "0.1.0"
description = "Windows 11 taskbar widget for Cursor and Codex usage"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pywin32>=306",
    "keyring>=25",
    "darkdetect>=0.8",
]

[project.scripts]
ai-usage-bar = "ai_usage_bar.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
